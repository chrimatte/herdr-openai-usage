id = "local.openai-usage"
name = "OpenAI Usage"
version = "0.3.1"
min_herdr_version = "0.9.5"
description = "OpenAI quotas for Codex: usage, availability and reset times."
platforms = ["macos", "linux"]

[[startup]]
command = ["node", "src/cli.mjs", "auto-sync"]

[[events]]
on = "pane.created"
command = ["node", "src/cli.mjs", "auto-event"]

[[events]]
on = "pane.agent_detected"
command = ["node", "src/cli.mjs", "auto-event"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "src/cli.mjs", "auto-event"]

[[events]]
on = "pane.closed"
command = ["node", "src/cli.mjs", "auto-event"]

[[actions]]
id = "sync"
title = "OpenAI: enable for open chats"
contexts = ["global", "workspace", "tab", "pane"]
command = ["node", "src/cli.mjs", "auto-sync"]

[[actions]]
id = "open"
title = "OpenAI: indicator below the chat"
contexts = ["global", "workspace", "tab", "pane"]
command = ["node", "src/cli.mjs", "open"]

[[actions]]
id = "details"
title = "OpenAI: usage details"
contexts = ["workspace", "tab", "pane"]
command = ["node", "src/cli.mjs", "details"]

[[actions]]
id = "dashboard"
title = "OpenAI: open usage page"
contexts = ["global", "workspace", "tab", "pane"]
command = ["node", "src/cli.mjs", "dashboard"]

[[panes]]
id = "indicator"
title = "OpenAI · available quota"
placement = "split"
command = ["node", "src/cli.mjs", "watch", "--compact"]

[[panes]]
id = "monitor"
title = "OpenAI Usage"
placement = "overlay"
command = ["node", "src/cli.mjs", "watch"]
